spring:
  application:
    name: provisio-orchestrator

  # MongoDB connection (ADR 0023). Defaults for running on the host against the local Docker Compose stack.
  # A single host with no replica set name makes the driver connect directly to that host: the replica set member
  # is registered as mongodb:27017, a name that does not resolve outside the Compose network.
  # The password comes from the environment only and has no default: startup fails if it is missing.
  mongodb:
    host: localhost
    port: 27017
    database: provisio
    username: provisio
    password: ${MONGODB_APP_PASSWORD}
    authentication-database: admin

  data:
    mongodb:
      # Indexes are created explicitly by the module that owns the collection (ADR 0022)
      auto-index-creation: false

# Defaults for running on the host against the local Docker Compose stack.
# Inside Compose they are overridden through environment variables
# (e.g. CAMUNDA_CLIENT_GRPCADDRESS, CAMUNDA_CLIENT_RESTADDRESS).
camunda:
  client:
    mode: self-managed
    grpc-address: http://localhost:26500
    rest-address: http://localhost:8080

# Forecasting module (ADR 0030). The service URL defaults to the local stack as seen from the host; inside Compose it
# is overridden with PROVISIO_FORECASTING_BASEURL. The policy values are placeholders until supplier data provides
# lead times (v0.3.0); every forecast stores the values it was computed with.
provisio:
  forecasting:
    base-url: http://localhost:8000
    connect-timeout: 2s
    read-timeout: 60s      # one chunk; the job timeout (10 min) covers the whole run
    chunk-size: 20         # products per request, at most 100 (contract)
    horizon-days: 28       # forecast days from asOf; at least the protection interval (ceil(14) + 7 = 21)
    default-policy:
      lead-time-mean-days: 14
      # lead-time-std-days: absent, the lead time is treated as known
      review-period-days: 7
      service-level: 0.95

  # Time module (ADR 0031). The business date is inside the sales data, not the wall-clock date.
  # mapped: today's UTC date in mapped.year, or in the year before if that falls after mapped.latest.
  # fixed: always fixed-date (a demo scenario, a reproduction), e.g. PROVISIO_BUSINESSTIME_MODE=fixed and
  # PROVISIO_BUSINESSTIME_FIXEDDATE=2011-12-05. Spike 003 (v0.5.0) replaces both.
  business-time:
    mode: mapped
    mapped:
      year: 2011
      latest: 2011-12-09   # the first day after the observed data, the last asOf the forecast batch accepts
