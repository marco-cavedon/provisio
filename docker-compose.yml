# Provisio — local runtime (ADR 0007). One command: `docker compose up -d`.
# Step 1 of v0.1.0: infrastructure only (Camunda 8.9 + MongoDB with Search / Vector Search).
# Every host port is bound to 127.0.0.1: nothing is exposed beyond this machine.
name: provisio

services:

  # ---------------------------------------------------------------- Camunda 8.9 (lightweight)

  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.9.23}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration: # Zeebe + Operate + Tasklist; H2 as secondary storage (no Elasticsearch)
    image: camunda/camunda:${CAMUNDA_VERSION:-8.9.23}
    ports:
      - "127.0.0.1:26500:26500" # gRPC (job workers)
      - "127.0.0.1:9600:9600"   # management / health
      - "127.0.0.1:8080:8080"   # REST API, Operate, Tasklist
    mem_limit: 1g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      retries: 30
      start_period: 30s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

  connectors: # runs the AI Agent connector
    image: camunda/connectors-bundle:${CAMUNDA_CONNECTORS_VERSION:-8.9.14}
    environment:
      # Only credentials are connector secrets (ADR 0017), mapped explicitly: least privilege.
      SECRET_LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is not set, see .env.example}
    mem_limit: 512m
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 2s
      retries: 10
      start_period: 30s
    configs:
      - source: connectors-config
        target: application.yaml
    depends_on:
      orchestration:
        condition: service_healthy

  # ---------------------------------------------------------------- MongoDB + mongot

  mongodb: # single-node replica set, required by mongot (change streams); access control enabled
    image: mongodb/mongodb-community-server:${MONGODB_VERSION:-9.0.2-ubi8}
    # A replica set with access control needs a keyfile for internal authentication between members.
    # With a single member nothing else reads it, so a fresh random keyfile is generated at every start:
    # nothing to store, nothing to leak. mongod requires it to be readable by its owner only.
    entrypoint:
      - sh
      - -c
      - >-
        head -c 756 /dev/urandom | base64 -w 0 > /tmp/mongod-keyfile &&
        chmod 400 /tmp/mongod-keyfile &&
        exec mongod --config /etc/mongod.conf
    ports:
      - "127.0.0.1:27017:27017"
    mem_limit: 1g
    restart: on-failure
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20
      start_period: 10s
    volumes:
      - mongodb-data:/data/db
      - ./infra/mongodb/mongod.conf:/etc/mongod.conf:ro
      - ./infra/mongodb/scripts:/scripts:ro

  mongodb-init: # one-shot and idempotent: replica set + users (admin, mongot, provisio)
    image: mongodb/mongodb-community-server:${MONGODB_VERSION:-9.0.2-ubi8}
    # Shares mongod's network namespace, so it connects through localhost: the first user can only be
    # created through the localhost exception, which does not apply to connections over the Compose network.
    network_mode: "service:mongodb"
    entrypoint: ["mongosh", "--host", "localhost:27017", "--quiet", "--file", "/init/init-replica-set.js"]
    environment:
      MONGOT_PASSWORD: ${MONGOT_PASSWORD:?MONGOT_PASSWORD is not set, see .env.example}
      MONGODB_ADMIN_PASSWORD: ${MONGODB_ADMIN_PASSWORD:?MONGODB_ADMIN_PASSWORD is not set, see .env.example}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:?MONGODB_APP_PASSWORD is not set, see .env.example}
    volumes:
      - ./infra/mongodb/init:/init:ro
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy

  mongot: # MongoDB Search / Vector Search, Community edition
    image: mongodb/mongodb-community-search:${MONGOT_VERSION:-1.70.5}
    # mongot refuses a password file readable by anyone but its owner, while Compose mounts secrets
    # world-readable (0444). Copy the secret with 0400 permissions, then run the image's original command.
    entrypoint:
      - sh
      - -c
      - >-
        cp /run/secrets/mongot_password /tmp/mongot_password &&
        chmod 400 /tmp/mongot_password &&
        exec /mongot-community/mongot --config /mongot-community/config.default.yml
    restart: on-failure
    healthcheck:
      # The endpoint answers JSON, {"status":"SERVING"}; the image ships curl (no wget, no python)
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health | grep -q '\"status\":\"SERVING\"'"]
      interval: 10s
      retries: 30
      start_period: 20s
    volumes:
      - mongot-data:/data/mongot
      - ./infra/mongodb/mongot.yml:/mongot-community/config.default.yml:ro
    secrets:
      - mongot_password
    depends_on:
      mongodb-init:
        condition: service_completed_successfully

volumes:
  camunda:
  camunda-data:
  mongodb-data:
  mongot-data:

secrets:
  mongot_password:
    environment: MONGOT_PASSWORD

configs:
  orchestration-config:
    file: ./infra/camunda/application.yaml
  connectors-config:
    content: |
      camunda:
        client:
          mode: self-managed
          grpc-address: http://orchestration:26500
          rest-address: http://orchestration:8080
      management:
        endpoints:
          web:
            exposure:
              include: health
        endpoint:
          health:
            probes:
              enabled: true
