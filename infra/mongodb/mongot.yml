# mongot (MongoDB Search / Vector Search, Community) for Provisio local development.
# Reference: MongoDB docs, "Install mongot in a Docker Container".
syncSource:
  replicaSet:
    hostAndPort: "mongodb:27017"
    scramAuth:
      username: "mongot"
      passwordFile: "/run/secrets/mongot_password"
      authSource: "admin"
    tls:
      enabled: false
    replicationReader:
      readPreference: "secondaryPreferred"

storage:
  dataPath: "/data/mongot"

server:
  grpc:
    address: "0.0.0.0:27028"
    tls:
      mode: "disabled"

metrics:
  enabled: true
  address: "0.0.0.0:9946"

healthCheck:
  address: "0.0.0.0:8080"

logging:
  verbosity: INFO
