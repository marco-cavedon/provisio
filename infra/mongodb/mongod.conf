# mongod for Provisio local development (ADR 0007).
# Single-node replica set: mongot synchronises its indexes through change streams,
# which require a replica set. A standalone mongod is not supported by mongot.

net:
  port: 27017
  bindIpAll: true          # inside the Compose network; the host port is bound to 127.0.0.1 only

replication:
  replSetName: rs0

storage:
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5     # keep the local footprint small

# Access control is disabled in local development: see infra/README.md.

setParameter:
  # Where mongod finds mongot, for search index management and for $search / $vectorSearch queries
  mongotHost: mongot:27028
  searchIndexManagementHostAndPort: mongot:27028
  skipAuthenticationToSearchIndexManagementServer: false
  useGrpcForSearch: true
  searchTLSMode: disabled
