name: Forecasting

# Runs on every PR and push to main, so its check can be required by the ruleset; a path-filter job decides whether
# the tests really run (same pattern as seed.yml).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect forecasting changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists the PR's changed files via the GitHub API
    outputs:
      forecasting: ${{ steps.filter.outputs.forecasting }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            forecasting:
              - 'forecasting/**'
              - 'contracts/forecasting/**'
              - '.github/workflows/forecasting.yml'
            image:
              - 'forecasting/**'
              - 'docker-compose.yml'
              - '.github/workflows/forecasting.yml'
              - '.github/workflows/release.yml'

  test:
    name: Forecasting service and contract
    needs: changes
    if: needs.changes.outputs.forecasting == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecasting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: forecasting
      - name: Lint and format
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      # Includes contract conformance (ADR 0028): models regenerated from the contract, routes, and Schemathesis.
      - name: Test
        run: uv run --locked pytest

  image:
    name: Forecasting Docker image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builds the image for both platforms the release workflow publishes, so a broken Dockerfile shows up here and
      # not on a version tag. Nothing is pushed.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the forecasting image for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: forecasting
          platforms: linux/amd64,linux/arm64
          push: false

      # The service as Compose runs it: built because the version is never published, healthy through the Compose
      # healthcheck, answering a valid request as the contract says. A version that is never published forces the build.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: forecasting
      - name: Start the service with Compose and call it
        env:
          PROVISIO_VERSION: ci-${{ github.run_id }}
          MONGOT_PASSWORD: ci
          MONGODB_ADMIN_PASSWORD: ci
          MONGODB_APP_PASSWORD: ci
        run: |
          docker compose up --detach --wait --wait-timeout 120 --no-deps forecasting \
            || { docker compose logs forecasting; exit 1; }
          user=$(docker compose exec -T forecasting id -u)
          [[ "$user" == "10001" ]] || { echo "::error::the service runs as uid $user, not 10001"; exit 1; }
          # The request of the service's own tests (tests/conftest.py): valid, so the placeholder answers 200
          (cd forecasting && uv run --locked python -c \
            'import json, sys; sys.path.insert(0, "tests"); from conftest import request_payload; print(json.dumps(request_payload()))' \
            > "$RUNNER_TEMP/request.json")
          status=$(curl --silent --output "$RUNNER_TEMP/response.json" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data @"$RUNNER_TEMP/request.json" http://127.0.0.1:8000/v1/forecasts)
          cat "$RUNNER_TEMP/response.json"; echo
          [[ "$status" == "200" ]] || { echo "::error::POST /v1/forecasts answered $status"; docker compose logs forecasting; exit 1; }
          docker compose down
