name: Orchestrator

# Runs on every PR and push to main, so the "build" check can be required by the ruleset.
# A path-filter job decides whether the build really runs: a job skipped via `if:` counts as
# successful for required checks, while a workflow not triggered at all would block the PR forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists the PR's changed files via the GitHub API
    outputs:
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            orchestrator:
              - 'orchestrator/**'
              - 'seed/data/**'   # the tests load the committed seed
              - 'mise.toml'
              - '.github/workflows/orchestrator.yml'
              - 'docker-compose.yml'
            image:
              - 'orchestrator/**'
              - 'docker-compose.yml'
              - '.github/workflows/orchestrator.yml'
              - '.github/workflows/release.yml'

  build:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    # Pinned rather than ubuntu-latest: the tests start mongod, which needs a workaround on the Linux 6.19+ kernel of
    # Ubuntu 26.04 (SERVER-121912). A pinned label tests that case every time, instead of depending on which image
    # the runner pool happens to assign during the ubuntu-latest migration.
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: orchestrator/pom.xml
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: TEMPORARY report test failures
        if: failure()
        working-directory: orchestrator
        run: |
          for f in target/surefire-reports/*.txt; do
            if grep -qE "FAILURE|ERROR" "$f"; then
              echo "::error title=$(basename "$f")::$(head -c 4000 "$f" | tr '\n' ' ')"
            fi
          done
          grep -h "Caused by" target/surefire-reports/*.xml | sort | uniq -c | sort -rn | head -15 \
            | while read -r line; do echo "::error title=cause::${line:0:900}"; done
      - name: Publish module documentation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spring-modulith-docs
          path: orchestrator/target/spring-modulith-docs
          if-no-files-found: ignore

  image:
    name: Docker image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-26.04   # see the build job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builds the image for both platforms the release workflow publishes, so a broken Dockerfile shows up here and
      # not on a version tag. Runs in parallel with the tests; nothing is pushed.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the orchestrator image for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: orchestrator
          platforms: linux/amd64,linux/arm64
          push: false

      # Compose names the published image and keeps the build as a fallback. Until a version is published (and on any
      # clone of main between a merge and the next tag) the pull fails and Compose must build instead. A version that
      # is never published forces that path.
      - name: Check that Compose builds when the image cannot be pulled
        env:
          PROVISIO_VERSION: ci-${{ github.run_id }}
          LLM_API_KEY: ci
          MONGOT_PASSWORD: ci
          MONGODB_ADMIN_PASSWORD: ci
          MONGODB_APP_PASSWORD: ci
        run: |
          docker compose up --no-start --no-deps orchestrator
          docker image inspect --format '{{.Id}}' "ghcr.io/marco-cavedon/provisio-orchestrator:${PROVISIO_VERSION}"
          docker compose down

      # A fresh clone's first start, for the MongoDB part: mongod must start on this kernel (SERVER-121912 workaround in
      # docker-compose.yml), and mongodb-init must initiate the replica set and create the users from an empty volume.
      # It runs twice, because the second run takes the other path: the localhost exception is closed, so it
      # authenticates as admin and updates the users.
      - name: Check that the Compose MongoDB starts and initialises
        env:
          MONGOT_PASSWORD: ci
          MONGODB_ADMIN_PASSWORD: ci
          MONGODB_APP_PASSWORD: ci
        run: |
          uname -r
          docker compose up --detach --wait --wait-timeout 120 --no-deps mongodb \
            || { docker compose logs mongodb; exit 1; }
          for run in first second; do
            docker compose up --detach --no-deps --force-recreate mongodb-init
            code=$(docker wait "$(docker compose ps --all --quiet mongodb-init)")
            docker compose logs --no-log-prefix mongodb-init
            [[ "$code" == "0" ]] || { echo "::error::mongodb-init failed on the $run run (exit $code)"; exit 1; }
          done
          docker compose down --volumes
