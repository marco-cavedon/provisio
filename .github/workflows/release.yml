name: Release images

# Publishes the services' Docker images to GitHub Container Registry on every version tag (ADR 0015, ADR 0018),
# only once the repository is public (ADR 0024).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  private-repository:
    name: Skip publication (private repository)
    if: github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::The repository is private, so no image is published for ${GITHUB_REF_NAME} (ADR 0024)."

  orchestrator:
    name: Publish orchestrator image
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io with the workflow token, no personal token
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/provisio-orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Compose pins the image version, so a clone of the tag runs exactly that tag's code. The release-preparation
      # pull request bumps it; a tag without the bump would publish an image that its own Compose file never pulls.
      - name: Check that Compose pulls this version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual=$(grep -oP 'provisio-orchestrator:\$\{PROVISIO_VERSION:-\K[^}]+' docker-compose.yml)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error file=docker-compose.yml::Compose pulls orchestrator ${actual:-<none>}, the tag is ${expected}."
            exit 1
          fi

      # Only the runtime stage runs under emulation (see orchestrator/Dockerfile)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags 0.1.1 and 0.1 from v0.1.1; no "latest", so nothing floats away from a released version
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Provisio orchestrator
            org.opencontainers.image.description=Provisio job workers (agent tools) for Camunda 8
          annotations: |
            org.opencontainers.image.description=Provisio job workers (agent tools) for Camunda 8
        env:
          # The registry shows the description of a multi-platform image from the index annotations
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: orchestrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
