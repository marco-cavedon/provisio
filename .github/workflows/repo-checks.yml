name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists the PR's commits via the GitHub API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"   # read-only token: report via the failed check, not PR comments

  commit-identities:
    name: Commit identities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history: rewritten or older commits are checked too
      - name: Check author, committer and co-author emails
        run: .github/scripts/check-commit-identities.sh HEAD

  compose:
    name: Compose file validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate docker-compose.yml
        # Dummy values: the check validates structure and interpolation, it starts nothing.
        # LLM_API_KEY is deliberately unset: it is optional until the agent process exists.
        env:
          MONGOT_PASSWORD: ci-placeholder
          MONGODB_ADMIN_PASSWORD: ci-placeholder
          MONGODB_APP_PASSWORD: ci-placeholder
        run: docker compose config --quiet

  init-env:
    name: init-env script (${{ matrix.os }})
    # macOS runs the bash 3.2 and BSD tools that most readers of the quickstart have; Ubuntu also runs the case that
    # needs Docker (macOS runners have none).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck infra/init-env.sh .github/scripts/test-init-env.sh
      - name: Test infra/init-env.sh
        run: .github/scripts/test-init-env.sh

  docs:
    name: Docs lint and internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true
